name: Gerar APK 1 REAL

on:
  workflow_dispatch:
  push:
    paths:
      - '1_REAL_Android_projeto.zip'
      - '.github/workflows/android.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Descompactar projeto
        run: unzip -o 1_REAL_Android_projeto.zip -d .

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar APK
        run: gradle -p 1_REAL_Android assembleDebug

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: 1-REAL-APK
          path: 1_REAL_Android/app/build/outputs/apk/debug/app-debug.apk
