name: Gerar chave do 1 REAL

on:
  workflow_dispatch:

jobs:
  gerar:
    runs-on: ubuntu-latest

    steps:
      - name: Gerar chave e converter
        run: |
          keytool -genkeypair \
            -keystore 1-real.jks \
            -alias umreal \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "${{ secrets.KEYSTORE_PASSWORD }}" \
            -keypass "${{ secrets.KEYSTORE_PASSWORD }}" \
            -dname "CN=1 REAL, OU=Games, O=1 REAL, L=Brasil, ST=SP, C=BR"

          base64 -w 0 1-real.jks > chave-base64.txt

      - name: Salvar arquivos
        uses: actions/upload-artifact@v4
        with:
          name: chave-1-real
          path: |
            1-real.jks
            chave-base64.txt
